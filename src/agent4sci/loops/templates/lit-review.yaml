id: lit-review
name: 文献综述
category: pipeline
description: 研究简报 → 系统检索与阅读 → 综述写作⟲评审 → 终审 → 整理记忆
inputs:
  question: {label: 综述主题 / 问题, type: text, required: true}
settings: {max_cost_usd: 10, auto_commit: true}
nodes:
  - {id: start, type: start, label: 开始, position: {x: 0, y: 0}}
  - id: scope
    type: agent
    label: 综述范围
    position: {x: 0, y: 110}
    config: {harness: assistant, role: scoper, outputs: [plan/brief.md], checkpoint: true,
             prompt: "综述主题：{{inputs.question}}\n\n请写出综述范围与纳入标准 plan/brief.md。"}
  - id: literature
    type: agent
    label: 检索与阅读
    position: {x: 0, y: 220}
    config: {harness: librarian, role: librarian, outputs: [lit/review.md, references.bib],
             prompt: "按 plan/brief.md 的纳入标准做系统检索、筛选与阅读，写出 lit/review.md。"}
  - id: write_review
    type: loop
    label: 写作 ⟲ 评审
    position: {x: -60, y: 330}
    width: 420
    height: 320
    config: {max_iterations: 3, until: "nodes.review.output.result.decision == 'accept'"}
  - id: write
    type: agent
    label: 撰写综述
    parent: write_review
    position: {x: 60, y: 50}
    config: {harness: writer, role: writer, outputs: [paper/paper.src.md, paper/paper.md],
             prompt: "{{'根据评审意见修改：' + nodes.review.output.summary if loop.iteration > 1 else '基于 lit/review.md 撰写一篇完整的综述文章。'}}"}
  - id: review
    type: agent
    label: 评审
    parent: write_review
    position: {x: 60, y: 180}
    config:
      harness: reviewer
      role: reviewer
      outputs: [review/review.md]
      prompt: 评审 paper/paper.md（重点：覆盖面、引用是否真实相关、结论是否有据）。
      output_schema:
        type: object
        properties: {decision: {enum: [accept, minor, major]}, issues: {type: array, items: {type: string}}}
        required: [decision]
  - id: final
    type: human
    label: 终审
    position: {x: 0, y: 690}
    config: {kind: approve, title: 终审综述, message: "{{nodes.review.output.summary}}", show_files: [paper/paper.md]}
  - {id: remember, type: memory, label: 整理记忆, position: {x: 0, y: 800}, config: {action: consolidate}}
  - {id: end, type: end, label: 结束, position: {x: 0, y: 910}}
edges:
  - {source: start, target: scope}
  - {source: scope, target: literature}
  - {source: literature, target: write_review}
  - {source: write, target: review}
  - {source: write_review, target: final}
  - {source: final, target: remember}
  - {source: remember, target: end}
