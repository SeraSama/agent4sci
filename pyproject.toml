[project]
name = "agent4sci"
version = "1.0.0"
description = "Agent framework and desktop app for automated scientific research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6",
    "openai>=3.15",
    "mcp>=2.2",
    "httpx2>=2.7",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "websockets>=15",
    "typer>=0.27",
    "rich>=15",
    "python-dotenv>=1.1",
    "keyring>=25.7",
    "platformdirs>=4.11",
    "simpleeval>=1.0.8",
    "pypdf>=6.19",
    "beautifulsoup4>=4.13",
    "markdownify>=1.2",
    "jupyter_client>=8.10",
]

[project.scripts]
a4s = "agent4sci.cli:app"
agent4sci-server = "agent4sci.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ipykernel>=7.3",
]
build = [
    "pyinstaller>=6.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent4sci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real model APIs (needs API keys; skipped by default)",
    "network: needs internet access",
]
addopts = "-m 'not live and not network'"
